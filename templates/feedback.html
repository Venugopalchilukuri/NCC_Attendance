<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback - NCC Attendance</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .feedback-card {
            max-width: 500px;
            margin: 50px auto;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .header-logo i {
            font-size: 3rem;
            color: #1a237e;
        }
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 5px;
        }
        .star-rating input { display: none; }
        .star-rating label {
            font-size: 2rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
        }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #ffc107;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="feedback-card card">
        <div class="card-body p-4">
            <div class="header-logo">
                <i class="bi bi-chat-heart"></i>
                <h2 class="h4 fw-bold mt-2">Student Feedback</h2>
                <p class="text-muted small">Your feedback is anonymous. No identity is collected.</p>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-4 text-center">
                    <label class="form-label d-block fw-semibold">Overall Rating</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5"><label for="star5" title="Excellent"><i class="bi bi-star-fill"></i></label>
                        <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="Very Good"><i class="bi bi-star-fill"></i></label>
                        <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="Good"><i class="bi bi-star-fill"></i></label>
                        <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="Fair"><i class="bi bi-star-fill"></i></label>
                        <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="Poor"><i class="bi bi-star-fill"></i></label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label fw-semibold">Feedback Message <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="message" name="message" rows="5" 
                              placeholder="Tell us what you think about the camp, training, or facilities..." required></textarea>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-semibold" style="background-color: #1a237e;">
                        <i class="bi bi-send me-2"></i>Submit Feedback
                    </button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <a href="/" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to Home
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
